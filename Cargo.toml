[package]
name = "simple_impl_attr_kit"
version = "0.2.2"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "The key-value attribute grammar for derive macros: every literal, lists, nested keys, repeated keys, a schema with defaults, one-of, requires and conflicts, and errors that point at the key."
authors = ["James Hunt <james@1o.business>"]
repository = "https://github.com/jameshuntt/simple_impl_attr_kit"
readme = "README.md"
keywords = ["proc-macro", "attributes", "derive", "syn", "parsing"]
categories = ["development-tools::procedural-macro-helpers", "parsing"]
include = ["src/**", "tests/**", "Cargo.toml", "CHANGELOG.md", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
liaise_proc_macro = { version = "0.1.3", path = "../liaise_proc_macro" }
